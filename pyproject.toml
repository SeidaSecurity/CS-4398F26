[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "network-management-app"
version = "0.1.0"
description = "Network management application - Tracks A and B services"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "dnslib>=0.9.24,<0.10",
    "fastapi>=0.115,<1.0",
    "icmplib>=3.0,<4.0",
    "netmiko>=4.4,<5.0",
    # paramiko 5 removed SHA-1 key exchange and ssh-rsa host keys, the only ones IOSv 15.9 offers.
    # Keep <5 while the lab uses IOSv (see docs/decisions/0003-pin-paramiko-for-iosv.md).
    "paramiko>=4.0,<5.0",
    "psycopg[binary]>=3.2,<4.0",
    "pysnmp>=7.1,<8.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.10,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
