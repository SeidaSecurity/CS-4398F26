! ios-lab-3 base configuration (SRS Appendix II).
! Replace LAB_PASSWORD and SNMP_COMMUNITY with the values in your local .env; never commit real values.
hostname ios-lab-3
ip domain-name lab.local
!
interface GigabitEthernet0/0
 description management (lab network)
 ip address 192.168.56.13 255.255.255.0
 no shutdown
!
username lab privilege 15 secret LAB_PASSWORD
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
snmp-server community SNMP_COMMUNITY RO
logging host 192.168.56.1
logging trap informational
service timestamps log datetime msec
!
end
write memory
