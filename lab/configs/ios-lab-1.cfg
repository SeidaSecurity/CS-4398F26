! ios-lab-1 base configuration (SRS Appendix II).
! Lab network: VMware NAT (VMnet8) 192.168.198.0/24. Windows PC = .1, VMware gateway = .2,
! CML UI = .128 (VMware DHCP range starts at .128, so routers use static .11-.14).
! Replace LAB_PASSWORD and SNMP_COMMUNITY with the values in your local .env.lab; never commit real values.
hostname ios-lab-1
ip domain-name lab.local
!
interface GigabitEthernet0/0
 description management (lab network)
 ip address 192.168.198.11 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description data link to ios-lab-2 (flap this for syslog tests)
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
username lab privilege 15 secret LAB_PASSWORD
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
snmp-server community SNMP_COMMUNITY RO
logging origin-id hostname
logging host 192.168.198.1
logging trap informational
service timestamps log datetime msec
!
end
write memory
